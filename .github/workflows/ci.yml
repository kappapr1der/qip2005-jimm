name: Source and updater verification
on:
  pull_request:
  push:
    branches: [main, 'work/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: python scripts/check_repository.py
      - name: Acquire pinned native toolchain
        shell: pwsh
        run: |
          ./scripts/acquire-toolchain.ps1
          "QIP_TOOLCHAIN=$PWD/build/toolchain/w64devkit/bin" >> $env:GITHUB_ENV
      - run: ./scripts/build-agent.ps1 -ToolchainBin $env:QIP_TOOLCHAIN
      - run: ./scripts/test.ps1 -ToolchainBin $env:QIP_TOOLCHAIN
      # No third-party payload is downloaded; no binary artifacts are uploaded on PRs.
