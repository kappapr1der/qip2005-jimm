name: Approved stable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable version tag (must equal VERSION)'
        required: true
        default: v1.1.0
      approval:
        description: 'Type PUBLISH_STABLE after reviewing this commit'
        required: true
permissions:
  contents: read
jobs:
  tests:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'PUBLISH_STABLE'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: python scripts/check_repository.py
      - name: Check release tag and redistribution evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag does not match VERSION.' }
          $rights = Get-Content docs/redistribution.json -Raw | ConvertFrom-Json
          if (-not $rights.qip_redistribution_approved -or -not $rights.evidence) { throw 'Public QIP redistribution is blocked: permission evidence missing.' }
      - run: ./scripts/acquire-toolchain.ps1
      - run: ./scripts/build-agent.ps1 -ToolchainBin "$PWD/build/toolchain/w64devkit/bin"
      - run: ./scripts/test.ps1 -ToolchainBin "$PWD/build/toolchain/w64devkit/bin"
  publish:
    needs: tests
    runs-on: windows-2025
    environment: qip-release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require a configured human approval rule
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $environment = gh api "repos/$env:GH_REPO/environments/qip-release" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not ($environment.protection_rules | Where-Object type -eq 'required_reviewers')) { throw 'Configure required reviewers for qip-release before publishing.' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - run: ./scripts/acquire-toolchain.ps1
      - run: ./scripts/build-agent.ps1 -ToolchainBin "$PWD/build/toolchain/w64devkit/bin"
      - name: Obtain verified private source package and official compiler
        env:
          QIP_SOURCE_PACKAGE_URL: ${{ secrets.QIP_SOURCE_PACKAGE_URL }}
        run: |
          if (-not $env:QIP_SOURCE_PACKAGE_URL.StartsWith('https://')) { throw 'Private source package URL must be HTTPS.' }
          New-Item -ItemType Directory private -Force | Out-Null
          try { Invoke-WebRequest -Uri $env:QIP_SOURCE_PACKAGE_URL -OutFile private/client.7z } catch { throw 'Private package download failed.' }
          if ((Get-FileHash private/client.7z).Hash -ne '0BCC0F2B0914F89AF68200FD811E8C96B9F28FCBDAC8FF034BDF02A81FD13A0C') { throw 'Private source package checksum mismatch.' }
          7z.exe x private/client.7z -oprivate/unpacked -y
          if ($LASTEXITCODE -ne 0) { throw 'Source extraction failed.' }
          Move-Item -LiteralPath private/unpacked/QIP2005_clean -Destination private/payload
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile private/inno.exe
          $signature = Get-AuthenticodeSignature private/inno.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Pyrsys B\.V\.') { throw 'Compiler installer signature mismatch.' }
          $inno = Start-Process -FilePath "$PWD/private/inno.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PORTABLE=1','/NOICONS','/TASKS=',('/DIR="'+$PWD+'/private/inno"')) -WindowStyle Hidden -Wait -PassThru
          if ($inno.ExitCode -ne 0) { throw 'Compiler preparation failed.' }
      - name: Build and sign release
        env:
          MANIFEST_SIGNING_KEY_B64: ${{ secrets.MANIFEST_SIGNING_KEY_B64 }}
        run: ./scripts/build-installer.ps1 -ISCC "$PWD/private/inno/ISCC.exe"
      - name: Publish after tests, signature checks and human approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create $env:RELEASE_TAG "dist/QIP2005-Jimm-Setup-$((Get-Content VERSION -Raw).Trim()).exe" dist/SHA256SUMS.txt dist/update-manifest.json dist/update-manifest.sig --repo $env:GH_REPO --target $env:GITHUB_SHA --title "QIP 2005 Jimm $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Stable release publication failed.' }
