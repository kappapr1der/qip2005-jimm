name: JimmStore manifest
on:
  pull_request:
    paths:
      - 'jimm-app.json'
      - 'assets/jimmstore/**'
      - 'scripts/*jimmstore*'
      - 'scripts/requirements-store.txt'
      - 'tests/test_jimmstore.py'
      - 'repository.json'
      - 'VERSION'
      - '.github/workflows/jimmstore.yml'
  push:
    branches: [main, 'work/**']
    paths:
      - 'jimm-app.json'
      - 'assets/jimmstore/**'
      - 'scripts/*jimmstore*'
      - 'scripts/requirements-store.txt'
      - 'tests/test_jimmstore.py'
      - 'repository.json'
      - 'VERSION'
      - '.github/workflows/jimmstore.yml'
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: jimmstore-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  manifest:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-store.txt
      - name: Validate using the official checksum-pinned schema
        run: python scripts/validate_jimmstore.py --fetch-schema --report build/jimmstore/validation.json
      - name: Test schema and additional documented requirements
        run: python -m unittest discover -s tests -p test_jimmstore.py -v
      - name: Match a published release tag to VERSION
        if: github.event_name == 'release'
        env:
          STORE_RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: python scripts/validate_jimmstore.py --release-tag $env:STORE_RELEASE_TAG
      # The store resolves GitHub versions itself. This job never submits an application.
